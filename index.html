<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta charset="utf-8" />
  </head>
  <body>
    <div class="info">
      <ul class="panel top left">
        <li class="item" id="savings"></li>
        <li class="item" id="days"></li>
      </ul>
      <ul class="panel bottom center">
        <li class="item" id="warning"></li>
      </ul>
      <ul class="panel top right">
        <li class="item">
          <a onclick="gc.toggleColor();"><span class="light">Light</span>/<span class="dark">Dark</span></a>
        </li>
      </ul>
    </div>
    <div class="scenes">
      <div class="scene active">
        <div class="content" id="welcome">
          <h2>Welcome to Desert!</h2>
        </div>
        <div class="buttons">
          <button class="option bottom center" onclick="gc.goToNextScene(this);">Start</button>
        </div>
      </div>
      <div class="scene" id="home">
        <div class="content">
          <h2>What should I do today?</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToSceneWithId(this, 'postWork', 'work');">Work</button>
          <button class="option bottom right" onclick="gc.goToSceneWithId(this, 'travel');">Travel</button>
        </div>
      </div>
      <div class="scene" id="postWork">
        <div class="content">
          <h2>What a day of work!</h2>
        </div>
        <div class="buttons">
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'home', 'sleep');">Sleep</button>
        </div>
      </div>
      <div class="scene" id="postTravel">
        <div class="content">
          <h2>What a day of travel!</h2>
        </div>
        <div class="buttons">
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'home', 'sleep');">Sleep</button>
        </div>
      </div>
      <div class="scene" id="travel">
        <div class="content">
          <h2>Where should I go?</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToSceneWithId(this, 'westJourney', 'travel');">← West</button>
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'home');">Back</button>
          <button class="option bottom right" onclick="gc.goToSceneWithId(this, 'eastJourney', 'travel');">East →</button>
          <button class="option top center secret hidden" onclick="gc.goToSceneWithId(this, 'northJourney', 'travel');">↑<br />North</button>
        </div>
      </div>
      <div class="scene" id="westJourney">
        <div class="content">
          <h2>West Start</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToNextScene(this);">← Continue</button>
          <button class="option bottom right" onclick="gc.goToSceneWithId(this, 'postTravel');">↪ Go Home</button>
        </div>
      </div>
      <div class="scene">
        <div class="content">
          <h2>West En Route</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToNextScene(this);">← Continue</button>
          <button class="option bottom right" onclick="gc.goToSceneWithId(this, 'postTravel');">↪ Go Home</button>
        </div>
      </div>
      <div class="scene" id="westDestination">
        <div class="content">
          <h2>West Destination</h2>
        </div>
        <div class="buttons">
          <button class="option bottom right" onclick="gc.goToSceneWithId(this, 'postTravel');">↪ Go Home</button>
        </div>
      </div>
      <div class="scene" id="eastJourney">
        <div class="content">
          <h2>East Start</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToSceneWithId(this, 'postTravel');">Go Home ↩</button>
          <button class="option bottom right" onclick="gc.goToNextScene(this);">Continue →</button>
        </div>
      </div>
      <div class="scene">
        <div class="content">
          <h2>East En Route</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToSceneWithId(this, 'postTravel');">Go Home ↩</button>
          <button class="option bottom right" onclick="gc.goToNextScene(this);">Continue →</button>
        </div>
      </div>
      <div class="scene" id="eastDestination">
        <div class="content">
          <h2>East Destination</h2>
        </div>
        <div class="buttons">
          <button class="option bottom left" onclick="gc.goToSceneWithId(this, 'postTravel');">Go Home ↩</button>
        </div>
      </div>
      <div class="scene" id="northJourney">
        <div class="content">
          <h2>North Start</h2>
        </div>
        <div class="buttons">
          <button class="option top center secret" onclick="gc.goToNextScene(this);">↑<br />Continue</button>
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'postTravel');">↷<br />Go Home</button>
        </div>
      </div>
      <div class="scene">
        <div class="content">
          <h2>North En Route</h2>
        </div>
        <div class="buttons">
          <button class="option top center secret" onclick="gc.goToNextScene(this);">↑<br />Continue</button>
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'postTravel');">↷<br />Go Home</button>
        </div>
      </div>
      <div class="scene" id="northDestination">
        <div class="content">
          <h2>North Destination</h2>
        </div>
        <div class="buttons">
          <button class="option bottom center" onclick="gc.goToSceneWithId(this, 'postTravel');">↷<br />Go Home</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
